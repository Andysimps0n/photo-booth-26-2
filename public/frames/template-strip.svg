<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340">
  <!-- TEMPLATE for the 3-photo strip. Canvas 1080 x 2340 px (same as the mono template).
       The art covers the WHOLE screen and is stretched to fit. Layout: header 187, bottom bar 94,
       sides 97, three equal photo windows 682 tall separated by 6.5px gaps. The shutter button floats
       over the camera, centred at y 2157 (about 200px across), so keep that spot free of detail.
       The windows are the transparent holes the camera/photos show through. -->
  <rect id="frame-bg" width="1080" height="2340" fill="#dddddd"/>

  <!-- Photo windows: cut these out of your artwork (make them real holes / transparent). -->
  <g id="windows" fill="none" stroke="#e5484d" stroke-width="4" stroke-dasharray="16 10">
    <rect id="window-1" x="97" y="187" width="886" height="682"/>
    <rect id="window-2" x="97" y="875.5" width="886" height="682"/>
    <rect id="window-3" x="97" y="1564" width="886" height="682"/>
  </g>

  <!-- Guides: delete before export. -->
  <g id="guides" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#333">
    <rect x="0" y="0" width="1080" height="187" fill="#4a90e2" fill-opacity="0.18"/>
    <text x="40" y="60">HEADER (y 0-187) - title + toggle; keep right 380px clear (toggle)</text>
    <rect x="0" y="2246" width="1080" height="94" fill="#4a90e2" fill-opacity="0.18"/>
    <text x="40" y="2300">BOTTOM BAR (y 2246-2340)</text>
    <rect x="0" y="187" width="97" height="2059" fill="#50b36a" fill-opacity="0.18"/>
    <rect x="983" y="187" width="97" height="2059" fill="#50b36a" fill-opacity="0.18"/>
    <circle cx="540" cy="2157" r="100" fill="#e5484d" fill-opacity="0.25"/>
    <text x="540" y="2165" text-anchor="middle">SHUTTER</text>
    <text x="540" y="540" text-anchor="middle">window-1 886 x 682</text>
    <text x="540" y="1230" text-anchor="middle">window-2 886 x 682</text>
    <text x="540" y="1920" text-anchor="middle">window-3 886 x 682</text>
  </g>
</svg>
